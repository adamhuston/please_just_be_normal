<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light">
	<meta name="description" content="A local, deterministic text normalizer for email copy.">
	<title>Please just be normal</title>
	<link rel="stylesheet" href="styles.css">
	<script src="vendor/marked.js" defer></script>
	<script src="vendor/lucide.js" defer></script>
	<script src="normalizer.js" defer></script>
	<script src="app.js" defer></script>
</head>
<body>
	<main>
		<header class="masthead" style="flex-direction: column; justify-content: space-between;">
			<div class="brand"><h1>Please just be normal<span class="period">.</span></h1></div>
            <div>
                <span>Text normalizer</span>
            </div>
		</header>
		<section class="workspace" aria-label="Text normalizer">
			<div class="settings">
				<span class="settings-title">Cleanup</span>
				<label class="switch"><input id="join-lines" type="checkbox"><span class="switch-track" aria-hidden="true"></span><span>Join wrapped lines</span></label>
				<label class="switch"><input id="markdown" type="checkbox"><span class="switch-track" aria-hidden="true"></span><span>Remove Markdown</span></label>
				<button id="sample" class="button subtle"><i data-lucide="flask-conical" aria-hidden="true"></i>Sample</button>
			</div>
			<div class="editors">
				<section class="editor source">
					<div class="editor-heading"><label for="input"><span class="step">01</span>Original</label><button id="clear" class="icon-button" aria-label="Clear original text" title="Clear original text" disabled><i data-lucide="trash-2" aria-hidden="true"></i></button></div>
					<textarea id="input" spellcheck="false" aria-label="Original text"></textarea>
					<div class="editor-footer"><span id="input-count">0 characters</span><span class="format-label">SOURCE TEXT</span></div>
				</section>
				<section class="editor result">
					<div class="editor-heading"><label for="output"><span class="step">02</span>Normalized</label><span id="result-state" class="result-state">Ready</span></div>
					<div class="line-info"><span id="line-info">Ln 1: 0 chars</span><span id="longest-line">Longest: 0 chars</span></div>
					<div class="ruler" aria-hidden="true"><span class="ruler-corner">COL</span><div id="ruler-scroll"><div id="ruler-track"></div></div></div>
					<div class="code-editor"><pre id="line-numbers" aria-hidden="true">1</pre><textarea id="output" readonly wrap="off" spellcheck="false" aria-label="Normalized text" aria-describedby="line-info longest-line"></textarea></div>
					<div class="editor-footer"><span id="output-count">0 characters</span><span id="line-count">1 line</span></div>
				</section>
			</div>
			<div class="action-bar"><div class="summary"><i data-lucide="check-check" aria-hidden="true"></i><span id="summary" role="status" aria-live="polite">No changes</span></div><button id="copy" class="button primary" disabled><i data-lucide="copy" aria-hidden="true"></i><span id="copy-label">Copy text</span></button></div>
			<p id="notice" role="status" aria-live="polite"></p>
		</section>
		<footer class="page-footer"><span>PLEASE JUST BE NORMAL / TEXT UTILITY</span></footer>
	</main>
</body>
</html>
